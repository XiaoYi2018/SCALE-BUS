[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scale-bus"
version = "0.2.0"
description = "Multiscale lesion measurements for breast ultrasound and their metrological characterization"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Bohan Li"},
  {name = "Qicheng Guo"},
  {name = "Hao Li"},
  {name = "Jun Ma"},
  {name = "Xunhuan Ren"},
  {name = "Yiming Chen"},
  {name = "Dmitriy A. Golosov"},
]
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "Pillow==11.1.0",
  "scipy==1.15.3",
  "scikit-image==0.25.0",
  "PyWavelets==1.8.0",
  "scikit-learn==1.6.1",
  "openpyxl==3.1.5",
  "joblib==1.4.2",
  "matplotlib==3.10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
